# Hand-written publications. The daily OpenReview bot NEVER touches this file.
#
# Use this for anything OpenReview won't have — e.g. venues that run on
# Microsoft CMT (ICAIF main track), or papers where you want to attach a
# code/project link that OpenReview has no field for.
#
# Rendered ABOVE the auto-synced list. When a paper later shows up on
# OpenReview, delete its entry here to avoid showing it twice.
#
# Fields: title (required), authors (list), venue, year, pdf, arxiv, code, page,
#         thumb, thumb_alt, thumb_linework
#
# `thumb` is the teaser / architecture figure shown in the frame on the left.
# Drop the file in assets/pubs/ (see the README there for sizing) and point at
# it with a site-root path. Set `thumb_linework: true` for a line diagram on a
# white background so it inverts along with the page in dark mode; leave it off
# for photos and screenshots. Entries with no thumb render as plain text.
#
# The title links to `page`, else `openreview`, else `arxiv`, else `pdf`.
#
# - title: "Paper title here"
#   authors:
#     - Yuncong Liu
#     - Co Author
#   venue: ICAIF (Poster)
#   year: '2026'
#   pdf: https://...
#   arxiv: https://arxiv.org/abs/...
#   code: https://github.com/...
#   thumb: /assets/pubs/my-paper.png
#   thumb_linework: true

- title: Lead-Lag Origination for Prioritizing Financial KOL Narratives
  authors:
    - Yuncong Liu
    - Yao Lu
  venue: ICAIF (Poster)
  year: '2026'
  pdf: /assets/papers/llr-icaif26.pdf
  thumb: /assets/pubs/llr.png
  thumb_alt: The Lead-Lag Router scoring candidate frames into a top-b shortlist
