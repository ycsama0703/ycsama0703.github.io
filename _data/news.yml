# Newest first. `date` is shown verbatim, so use whatever granularity you want.
# `text` may contain HTML.
#
# Wrap emoji in <span class="emoji">…</span>: dark mode inverts the whole
# body, and the theme's .emoji rule inverts them back so they keep their
# real colours. Without it 🎉 turns blue-green.

- date: "2026-10"
  # Keep each item to one line. The list indents the text past the date, but a
  # wrapped second line returns to the left margin, so it lands under the date
  # instead of under the sentence and the column falls apart.
  text: "Oral presentation at an <b>ICAIF 2026</b> workshop!"

- date: "2026-10"
  text: "Two papers accepted at <b>ICAIF 2026</b>! <span class=\"emoji\">🎉</span>"

- date: "2025-08"
  text: "Started my PhD at <a href='https://www.aidf.nus.edu.sg'>AIDF</a>, NUS."
