<!DOCTYPE html>
<html lang="{{ page.lang | default: "en" }}">
  {%- include head.html -%}
  <body a="{{ site.theme_config.appearance | default: "auto" }}">
    <!-- Applied before paint so a saved choice does not flash the other scheme. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("appearance");
          if (s === "light" || s === "dark") document.body.setAttribute("a", s);
        } catch (e) {}
      })();
    </script>

    <!-- Zero-height sticky slot, not position:fixed — see cool.css for why. -->
    <div id="scheme-toggle-slot">
      <button id="scheme-toggle" type="button" aria-label="Toggle colour scheme"></button>
    </div>

    <main class="page-content" aria-label="Content">
      <div class="w">
        {{ content }}
      </div>
    </main>

    {%-if site.goat_counter and jekyll.environment == "production"-%}
      {%-include goat_counter.html-%}
    {%-endif-%}

    {% if page.custom_js %}
      {% for js_file in page.custom_js %}
        <script type="text/javascript" src="{{ site.baseurl }}/assets/js/{{ js_file }}.js"></script>

        function effective() {
          var a = document.body.getAttribute("a");
          if (a === "light" || a === "dark") return a;
          return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }

        function paint() {
          var dark = effective() === "dark";
          // Icon shows the scheme the click will switch TO.
          btn.innerHTML = dark ? SUN : MOON;
          btn.title = dark ? "Switch to light" : "Switch to dark";
        }

        btn.addEventListener("click", function () {
          var next = effective() === "dark" ? "light" : "dark";
          document.body.setAttribute("a", next);
          try { localStorage.setItem("appearance", next); } catch (e) {}
          paint();
        });

        // Follow the OS while the visitor has not chosen for themselves.
        window.matchMedia("(prefers-color-scheme: dark)")
              .addEventListener("change", function () {
                if (document.body.getAttribute("a") === "auto") paint();
              });

        paint();
      })();
